name: CI

# Not for documentation alone, but for the manual (built into the app); not
# for the Scoop manifest (bucket/, committed after each release: nothing
# built reads it); not for tags (their commit was tested on its branch).
on:
  push:
    branches: ["**"]
    paths: ["**", "!docs/**", "!**.md", "!bucket/**", "docs/manual/**"]
  pull_request:
    paths: ["**", "!docs/**", "!**.md", "!bucket/**", "docs/manual/**"]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # The image's .NET, Android, Haskell and CodeQL toolchains, unused
        # here: room for the tests' build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        # ALSA for sound playback (rodio).
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (the tests run by hand)
        # `test = false` in their manifests: --all-targets leaves them out.
        run: |
          cargo clippy -p mg-ui --test screens --test frame_perf --test world_perf --test campaign_perf --test editor_perf -- -D warnings
          cargo clippy -p mg-corpus-tests --test client_render --test client_minimap -- -D warnings
      - name: Test
        # Corpus, differential and engine tests skip without a game install.
        # Not the examples (developer tools; a plain `cargo test` links all
        # 22 of them; clippy has checked them above).
        run: cargo test --workspace --lib --bins --tests
      - name: Documentation tests
        run: cargo test --workspace --doc
