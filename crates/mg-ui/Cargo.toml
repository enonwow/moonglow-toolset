[package]
name = "mg-ui"
description = "Moonglow's user interface (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opt-in diagnostics only; normal GUI builds contain no measurement spans.
measure = ["mg-render/measure", "mg-area/measure", "mg-live/measure"]
measure-alloc = ["measure"]

[dependencies]
log = "0.4"
egui.workspace = true
egui-wgpu.workspace = true
egui_commonmark.workspace = true
egui_dock.workspace = true
fastrand.workspace = true
mg-2da.workspace = true
mg-core.workspace = true
mg-area.workspace = true
mg-live = { workspace = true, features = ["build"] }
mg-live-link = { path = "../mg-live-link" }
mg-audio.workspace = true
mg-edit.workspace = true
mg-image.workspace = true
glam.workspace = true
image.workspace = true
png.workspace = true
mg-gff.workspace = true
mg-mdl.workspace = true
mg-module.workspace = true
mg-nui.workspace = true
mg-plugin.workspace = true
mg-preview.workspace = true
mg-render.workspace = true
mg-resman.workspace = true
mg-rules.workspace = true
mg-ssf.workspace = true
mg-schema.workspace = true
mg-script.workspace = true
mg-set.workspace = true
mg-tiles.workspace = true
mg-tlk.workspace = true
serde.workspace = true
serde_json.workspace = true
skrifa.workspace = true
toml.workspace = true
wgpu.workspace = true

[dev-dependencies]
ron = "0.12"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
eframe.workspace = true
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
mg-erf.workspace = true
mg-testkit.workspace = true
rustls.workspace = true
rcgen.workspace = true
url = "2.5"
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "live_measure"
required-features = ["measure"]
# Run by hand (every test in them is ignored: pictures and timings), so
# `cargo test` does not link them; `cargo test -p mg-ui --test screens`
# builds one as before. Clippy's --all-targets leaves them out too: CI and
# CLAUDE.md name them to it.
[[test]]
name = "screens"
path = "tests/screens.rs"
test = false

[[test]]
name = "frame_perf"
path = "tests/frame_perf.rs"
test = false

[[test]]
name = "world_perf"
path = "tests/world_perf.rs"
test = false

[[test]]
name = "campaign_perf"
path = "tests/campaign_perf.rs"
test = false

[[test]]
name = "editor_perf"
path = "tests/editor_perf.rs"
test = false

[[test]]
name = "nui_perf"
path = "tests/nui_perf.rs"
test = false
