[package]
name = "mg-live"
description = "Live mode: a running game's state and commands — the store, the HTTPS API for clients and the Redis link to the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Module preparation is not needed by a headless Live consumer.
build = ["dep:mg-module", "dep:mg-resman", "dep:mg-tlk", "dep:zip"]
# Diagnostic replay only; never enabled by the normal GUI or agent service.
measure = []

[dependencies]
anyhow.workspace = true
zip = { workspace = true, optional = true }
mg-module = { workspace = true, optional = true }
mg-resman = { workspace = true, optional = true }
mg-tlk = { workspace = true, optional = true }
mg-gff.workspace = true
mg-core.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rcgen.workspace = true
getrandom = "0.3"
log = "0.4"
ring = "0.17"

[lints]
workspace = true

[[test]]
name = "live_build"
required-features = ["build"]

[[test]]
name = "measure_fixture"
required-features = ["build"]

[[test]]
name = "private_fixture"
required-features = ["build"]

[dev-dependencies]
proptest.workspace = true
