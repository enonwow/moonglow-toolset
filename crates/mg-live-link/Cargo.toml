[package]
name = "mg-live-link"
description = "Desktop gateway transport, authentication and passive Live views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mg-live.workspace = true
log = "0.4"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha1 = "0.10"
httparse = "1"
base64.workspace = true
getrandom = "0.3"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2.5"
webpki-roots = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tempfile = "3"

[dev-dependencies]
rcgen.workspace = true
mg-gateway = { path = "../mg-gateway" }
axum = { version = "0.8", features = ["ws"] }

[lints]
workspace = true
