[package]
name = "mg-gateway"
description = "Authenticated Live gateway transport and host interfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mg-live.workspace = true
mg-module.workspace = true
mg-core.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
image.workspace = true
png.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"
mg-gff.workspace = true
mg-resman.workspace = true
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
